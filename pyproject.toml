[project]
name = "dspy-auto-gepa"
version = "0.1.8"
description = "Thin orchestration package around DSPy's GEPA optimizer"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Edward Boswell", email = "thememium@gmail.com" }]
keywords = ["dspy", "ai", "gepa", "optimizer", "orchestration", "optimization"]
classifiers = [
  "Operating System :: OS Independent",
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "dspy>=3.2.1",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "tqdm>=4.67.3",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/thememium/dspy-auto-gepa"
Documentation = "https://github.com/thememium/dspy-auto-gepa"
Repository = "https://github.com/thememium/dspy-auto-gepa.git"
Issues = "https://github.com/thememium/dspy-auto-gepa/issues"
Changelog = "https://github.com/thememium/dspy-auto-gepa/blob/master/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dspy_auto_gepa*"]

[dependency-groups]
dev = [
  "deptry>=0.25.1",
  "isort>=8.0.1",
  "poethepoet>=0.46.0",
  "pytest>=9.0.3",
  "pytest-cov>=7.1.0",
  "ruff>=0.15.13",
  "ty>=0.0.38",
  "usechange>=0.1.43",
]

[tool.pytest.ini_options]
filterwarnings = ["ignore:.*prefix.*:DeprecationWarning:dspy.*"]

[tool.deptry]
known_first_party = ["dspy_auto_gepa"]
per_rule_ignores = { DEP002 = ["pandas", "pyarrow"] }

[tool.poe.tasks]
example-basic = "uv run examples/basic.py"
example-data = "uv run examples/data.py"
clean-full = "sh -c 'uv run isort . && uv run ruff check . --fix && uv run ruff format . && uv run deptry . && uv run ty check'"
clean = "sh -c 'uv run isort . && uv run ruff format .'"
test = "uv run pytest tests/ -v"
test-cov = "uv run pytest tests/ -v --cov=dspy_auto_gepa --cov-report=term-missing"
test-e2e = "uv run pytest tests/ -v --run-e2e"
sort = "uv run isort ."
lint = "uv run ruff check ."
format = "uv run ruff format ."
deptry = "uv run deptry ."
typecheck = "uv run ty check"
release = "uv run usechange release"
